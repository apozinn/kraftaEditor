name: Build

on:
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unity:
    name: Build (Unity)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
          libsecret-1-dev libnotify-dev libsm-dev \
          libxext-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev

    - name: Add extra swap space (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo fallocate -l 4G /mnt/extra-swapfile 2>/dev/null \
          || sudo dd if=/dev/zero of=/mnt/extra-swapfile bs=1M count=4096 2>/dev/null
        sudo chmod 600 /mnt/extra-swapfile
        sudo mkswap /mnt/extra-swapfile
        sudo swapon /mnt/extra-swapfile
        echo "--- Swap ativo ---"
        swapon --show

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Cache FetchContent
      uses: actions/cache@v4
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}/_deps
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-fetchcontent-

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-build-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-build-

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DENABLE_UNITY_BUILD=ON
        -DENABLE_WERROR=ON
        -S ${{ github.workspace }}

    - name: Build
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config ${{ matrix.build_type }}
        --parallel 2

    - name: Package (CPack)
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: cpack --config CPackConfig.cmake -C ${{ matrix.build_type }}

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: kraftaEditor-${{ runner.os }}-${{ matrix.c_compiler }}
        path: |
          build/bin/${{ matrix.build_type }}/kraftaEditor
          build/bin/${{ matrix.build_type }}/kraftaEditor.exe
          build/bin/${{ matrix.build_type }}/Krafta Editor.app
        if-no-files-found: ignore
        retention-days: 7

    - name: Attach packages to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/*.deb
          build/*.rpm
          build/*.tar.gz
          build/*.exe
          build/*.zip
          build/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-strict:
    name: Build (no Unity, strict includes)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev libgl1-mesa-dev libglu1-mesa-dev \
          libsecret-1-dev libnotify-dev libsm-dev \
          libxext-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev

    - name: Add extra swap space (Linux)
      run: |
        sudo fallocate -l 4G /mnt/extra-swapfile 2>/dev/null \
          || sudo dd if=/dev/zero of=/mnt/extra-swapfile bs=1M count=4096 2>/dev/null
        sudo chmod 600 /mnt/extra-swapfile
        sudo mkswap /mnt/extra-swapfile
        sudo swapon /mnt/extra-swapfile
        swapon --show

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Cache FetchContent
      uses: actions/cache@v4
      with:
        path: ${{ steps.strings.outputs.build-output-dir }}/_deps
        key: ${{ runner.os }}-gcc-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-gcc-fetchcontent-

    - name: Configure CMake (no Unity)
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_BUILD_TYPE=Release
        -DENABLE_UNITY_BUILD=OFF
        -DENABLE_WERROR=OFF
        -S ${{ github.workspace }}

    - name: Build (no Unity)
      run: >
        cmake --build ${{ steps.strings.outputs.build-output-dir }}
        --config Release
        --parallel 2
